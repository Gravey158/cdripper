name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Linux: Flatpak via flatpak-builder ─────────────────────────────────────
  linux-flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cdripper.flatpak
          manifest-path: flatpak/io.github.gravey158.cdripper.yml
          # Cache der gebauten Module zwischen Runs — spart ~10 Min beim
          # Re-Build wenn nur cdripper sich geändert hat.
          cache-key: flatpak-builder-${{ github.sha }}
          restore-cache-key: flatpak-builder-

      - uses: actions/upload-artifact@v7
        with:
          name: cdripper-linux-flatpak
          path: cdripper.flatpak
          retention-days: 30

  # ── macOS: native .app + .dmg, beide Architekturen ─────────────────────────
  # Hier stand macos-13. Dieses Image hat GitHub abgekündigt: Der Job bekam
  # keinen Runner mehr und lief nach 24 h ins Zeitlimit — sichtbar in jedem
  # Lauf seit Mai 2026, als "exceeded the maximum execution time while
  # awaiting a runner". Nichts war kaputt, es wartete nur auf eine Maschine,
  # die es nicht mehr gibt.
  #
  # Jetzt beide Architekturen: arm64 ist die Gegenwart, Intel läuft auf dem
  # letzten dafür angebotenen Image weiter. Der DMG-Name trägt die Architektur
  # ohnehin (CPACK_PACKAGE_FILE_NAME nutzt CMAKE_SYSTEM_PROCESSOR), die beiden
  # Artefakte kommen sich also nicht ins Gehege.
  macos:
    strategy:
      fail-fast: false      # ein fehlender Intel-Runner darf arm64 nicht mitreißen
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Homebrew deps
        run: |
          brew update
          brew install cmake pkg-config libcdio libcdio-paranoia libdiscid \
                       nlohmann-json qt@6 flac opus-tools lame taglib \
                       libebur128 fmt inih chromaprint ffmpeg curl librsvg

      - name: Build .app + .dmg
        run: ./scripts/build-mac.sh

      - name: Unit-Tests
        run: ./build-mac/cdripper_tests

      - uses: actions/upload-artifact@v7
        with:
          name: cdripper-macos-${{ matrix.arch }}
          path: build-mac/cdripper-*-macos-*.dmg
          retention-days: 30

  # ── Windows: vcpkg + MSVC + WiX MSI ────────────────────────────────────────
  # Sobald die VM-basierte Erstvalidierung durch ist (siehe windows/SETUP.md),
  # kann dieser Job auf jedem Push den Build verifizieren. vcpkg-Erstbau
  # dauert ~30–60 Min, danach via GHA-Cache <5 Min. Initial deshalb auf
  # workflow_dispatch oder Tag-Push eingeschränkt — bei jedem Main-Push
  # wäre der Cache-Miss-Erstbau zu teuer.
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lukka/get-cmake@latest

      - name: vcpkg bootstrap + deps
        uses: lukka/run-vcpkg@v11
        with:
          # Muss ein voller 40-stelliger Commit-Hash sein. Hier stand der
          # Release-Name '2024.12.16' — die Action lehnt den ab, und genau
          # daran ist der Windows-Build bisher in 30 Sekunden gescheitert,
          # bevor er auch nur eine Zeile übersetzt hat.
          # cd61e1e = vcpkg-Release 2026.06.24.
          vcpkgGitCommitId: 'cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3'
          runVcpkgInstall: true

      - name: WiX 6 install
        run: dotnet tool install --global wix

      - name: Build cdripper.exe
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Build .msi
        shell: pwsh
        run: ./scripts/build-msi.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: cdripper-windows-x64
          path: build-windows/cdripper-*-windows-x64.msi
          retention-days: 30

  # ── GitHub Release: bei Tag automatisch erstellen ──────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # windows gehoert mit hinein: ohne das konnte ein Release entstehen, waehrend
    # der Windows-Build noch lief oder scheiterte — die .msi fehlte dann still,
    # weil fail_on_unmatched_files aussteht.
    needs: [linux-flatpak, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/cdripper-linux-flatpak/*.flatpak
            artifacts/cdripper-macos-arm64/*.dmg
            artifacts/cdripper-macos-x86_64/*.dmg
            artifacts/cdripper-windows-x64/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: false
