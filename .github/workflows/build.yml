name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Linux: Flatpak via flatpak-builder ─────────────────────────────────────
  linux-flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cdripper.flatpak
          manifest-path: flatpak/io.github.gravey158.cdripper.yml
          # Cache der gebauten Module zwischen Runs — spart ~10 Min beim
          # Re-Build wenn nur cdripper sich geändert hat.
          cache-key: flatpak-builder-${{ github.sha }}
          restore-cache-key: flatpak-builder-

      - uses: actions/upload-artifact@v7
        with:
          name: cdripper-linux-flatpak
          path: cdripper.flatpak
          retention-days: 30

  # ── macOS: native .app + .dmg, beide Architekturen ─────────────────────────
  # Hier stand macos-13. Dieses Image hat GitHub abgekündigt: Der Job bekam
  # keinen Runner mehr und lief nach 24 h ins Zeitlimit — sichtbar in jedem
  # Lauf seit Mai 2026, als "exceeded the maximum execution time while
  # awaiting a runner". Nichts war kaputt, es wartete nur auf eine Maschine,
  # die es nicht mehr gibt.
  #
  # Jetzt beide Architekturen: arm64 ist die Gegenwart, Intel läuft auf dem
  # letzten dafür angebotenen Image weiter. Der DMG-Name trägt die Architektur
  # ohnehin (CPACK_PACKAGE_FILE_NAME nutzt CMAKE_SYSTEM_PROCESSOR), die beiden
  # Artefakte kommen sich also nicht ins Gehege.
  macos:
    strategy:
      fail-fast: false      # ein fehlender Intel-Runner darf arm64 nicht mitreißen
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Homebrew deps
        run: |
          brew update
          brew install cmake pkg-config libcdio libcdio-paranoia libdiscid \
                       nlohmann-json qt@6 flac opus-tools lame taglib \
                       libebur128 fmt inih chromaprint ffmpeg curl librsvg

      - name: Build .app + .dmg
        run: ./scripts/build-mac.sh

      - name: Unit-Tests
        # cdripper_tests ist EXCLUDE_FROM_ALL — der normale Build erzeugt es
        # nicht, es muss eigens angefordert werden.
        run: |
          cmake --build build-mac --target cdripper_tests
          ./build-mac/cdripper_tests

      - uses: actions/upload-artifact@v7
        with:
          name: cdripper-macos-${{ matrix.arch }}
          path: build-mac/cdripper-*-macos-*.dmg
          retention-days: 30

  # ── Windows: MSYS2/UCRT64 ──────────────────────────────────────────────────
  # Vorher MSVC + vcpkg. Das konnte nie funktionieren: libcdio,
  # libcdio-paranoia und libdiscid existieren als vcpkg-Pakete nicht, das
  # Manifest listete sie trotzdem, und jeder Lauf brach beim Aufloesen der
  # Abhaengigkeiten ab ("libcdio does not exist"). MSYS2 liefert alle drei
  # fertig, dazu Qt6 samt Uebersetzungswerkzeugen.
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p
            libcdio:p libcdio-paranoia:p libdiscid:p
            qt6-base:p qt6-tools:p nlohmann-json:p curl:p flac:p

      - name: Build + Tests
        run: ./scripts/build-windows-msys2.sh

      - uses: actions/upload-artifact@v7
        with:
          name: cdripper-windows-x64
          path: build-windows/cdripper-*-windows-x64.zip
          retention-days: 30

  # ── GitHub Release: bei Tag automatisch erstellen ──────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # windows gehoert mit hinein: ohne das konnte ein Release entstehen, waehrend
    # der Windows-Build noch lief oder scheiterte — die .msi fehlte dann still,
    # weil fail_on_unmatched_files aussteht.
    needs: [linux-flatpak, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/cdripper-linux-flatpak/*.flatpak
            artifacts/cdripper-macos-arm64/*.dmg
            artifacts/cdripper-macos-x86_64/*.dmg
            artifacts/cdripper-windows-x64/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
